name: build

# Builds the image and publishes it to GHCR.
# On a server, `docker compose pull && docker compose up -d` is then enough:
# no clone, no build.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Before building: does the code load, and are the example rules valid?
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --omit=dev

      - name: Syntax of every source file
        run: for f in src/*.js; do node --check "$f"; done

      - name: Example rules load and the engine responds
        run: node src/index.js --simulate fixtures/sample-text.json --config config/rules.example.yaml

      - name: Home Assistant actions against the fake HA
        run: |
          node tools/mock-ha.mjs 8199 > /tmp/mock-ha.log 2>&1 &
          MOCK_PID=$!
          sleep 2
          export HA_URL=http://127.0.0.1:8199
          export HA_TOKEN=test
          node src/index.js --check --config fixtures/ha-actions.yaml
          node src/index.js --simulate fixtures/sample-text.json --config fixtures/ha-actions.yaml --live
          kill "$MOCK_PID"
          echo "--- calls received ---"
          cat /tmp/mock-ha.log

      - name: Home commands (placeholders from capture groups)
        run: |
          node tools/mock-ha.mjs 8200 > /tmp/mock-home.log 2>&1 &
          MOCK_PID=$!
          sleep 2
          export HA_URL=http://127.0.0.1:8200
          export HA_TOKEN=test
          node src/index.js --simulate fixtures/home.json --config fixtures/home-commands.yaml --live
          kill "$MOCK_PID"
          echo "--- calls received ---"
          cat /tmp/mock-home.log
          grep -q 'light.bedroom' /tmp/mock-home.log \
            && echo "OK: called light.turn_on on light.bedroom" \
            || { echo "ERROR: entity_id never arrived"; exit 1; }

      - name: Assist chat (the answer reaches the placeholder)
        run: |
          node tools/mock-ha.mjs 8201 > /tmp/mock-assist.log 2>&1 &
          MOCK_PID=$!
          sleep 2
          export HA_URL=http://127.0.0.1:8201
          export HA_TOKEN=test
          node src/index.js --simulate fixtures/assist.json \
            --config fixtures/assist.yaml --live > /tmp/assist-out.log 2>&1
          kill "$MOCK_PID"
          echo "--- calls received ---"
          cat /tmp/mock-assist.log
          echo "--- the app said ---"
          cat /tmp/assist-out.log
          grep -q '"text":"turn on the kitchen light"' /tmp/mock-assist.log \
            && echo "OK: the prefix was stripped and the command reached Assist" \
            || { echo "ERROR: the prefix never left the message"; exit 1; }
          grep -q 'the kitchen light is on' /tmp/assist-out.log \
            && echo "OK: the Assist answer reached the placeholder" \
            || { echo "ERROR: the answer never arrived"; exit 1; }

      - name: Web panel
        run: node tools/web-smoke.mjs

      - name: Panel editor
        run: node tools/editor-test.mjs

      - name: Rule engine
        run: node tools/rules-test.mjs

      - name: Health
        run: node tools/health-test.mjs

  build:
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # On pull requests nothing is published: it only checks that the image builds
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
